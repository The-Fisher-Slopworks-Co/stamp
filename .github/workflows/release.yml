name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    name: Build .vsix and publish to Releases
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # `prepare` installs the lefthook git hook, which the packaging below
      # never needs; `vsce package` compiles through `vscode:prepublish`.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Package the extension
        run: npx --yes @vscode/vsce package --out "stamp-${{ github.ref_name }}.vsix"

      - name: Publish GitHub Release with the .vsix attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "stamp-${{ github.ref_name }}.vsix" \
            --title "${{ github.ref_name }}" \
            --generate-notes
